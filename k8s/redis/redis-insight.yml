apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-insight
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-insight
  template:
    metadata:
      labels:
        app: redis-insight
    spec:
      containers:
        - name: redis
          image: redis/redisinsight:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5540
---
apiVersion: v1
kind: Service
metadata:
  name: redis-insight
spec:
  type: NodePort
  selector:
    app: redis-insight
  ports:
    - port: 5540
      targetPort: 5540
      nodePort: 30554
