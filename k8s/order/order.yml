apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: ticket-box-backend-order-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          args: ["npx", "tsx", "src/index.ts"]
          envFrom:
            - secretRef:
                name: order-service-env
          env:
            - name: SERVICE_NAME
              value: "order-service"
            - name: PORT
              value: "3000"
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: PAYMENT_SERVICE_URL
              value: "http://payment-service:3000"
            - name: CONCERT_SERVICE_URL
              value: "http://concert-service:3000"
            - name: USER_SERVICE_URL
              value: "http://user-service:3000"

---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - port: 3000
      targetPort: 3000
