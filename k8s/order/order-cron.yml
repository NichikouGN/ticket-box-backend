apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-cron
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-cron
  template:
    metadata:
      labels:
        app: order-cron
    spec:
      containers:
        - name: order-cron
          image: ticket-box-backend-order-cron:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          args: ["npx", "tsx", "src/jobs/outboxCron.job.ts"]
          envFrom:
            - secretRef:
                name: order-service-env
          env:
            - name: SERVICE_NAME
              value: "order-cron"
            - name: PORT
              value: "3000"
            - name: REDIS_URL
              value: "redis://redis:6379"

---
apiVersion: v1
kind: Service
metadata:
  name: order-cron
spec:
  type: ClusterIP
  selector:
    app: order-cron
  ports:
    - port: 3000
      targetPort: 3000
