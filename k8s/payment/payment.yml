apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: ticket-box-backend-payment-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          args: ["npx", "tsx", "src/index.ts"]
          envFrom:
            - secretRef:
                name: payment-service-env
          env:
            - name: SERVICE_NAME
              value: "payment-service"
            - name: PORT
              value: "3000"
            - name: REDIS_URL
              value: "redis://redis:6379"

---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
spec:
  type: NodePort
  selector:
    app: payment-service
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30040
