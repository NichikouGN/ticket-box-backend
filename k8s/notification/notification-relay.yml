apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-relay
  template:
    metadata:
      labels:
        app: notification-relay
    spec:
      containers:
        - name: notification-relay
          image: ticket-box-backend-notification-relay:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          args: ["npx", "tsx", "src/daemons/outbox.relay.ts"]
          envFrom:
            - secretRef:
                name: notification-service-env
          env:
            - name: SERVICE_NAME
              value: "notification-relay"
            - name: PORT
              value: "3000"
            - name: REDIS_URL
              value: "redis://redis:6379"

---
apiVersion: v1
kind: Service
metadata:
  name: notification-relay
spec:
  type: ClusterIP
  selector:
    app: notification-relay
  ports:
    - port: 3000
      targetPort: 3000
