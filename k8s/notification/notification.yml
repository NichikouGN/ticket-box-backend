apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: ticket-box-backend-notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          args: ["npx", "tsx", "src/index.ts"]
          envFrom:
            - secretRef:
                name: notification-service-env
          env:
            - name: SERVICE_NAME
              value: "notification-service"
            - name: PORT
              value: "3000"
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: ORDER_SERVICE_URL
              value: "http://order-service:3000"

---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
spec:
  type: ClusterIP
  selector:
    app: notification-service
  ports:
    - port: 3000
      targetPort: 3000
