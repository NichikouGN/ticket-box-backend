apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: ticket-box-backend-api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000

          args: ["npx", "tsx", "src/index.ts"]

          envFrom:
            - secretRef:
                name: api-gateway-env
          env:
            - name: SERVICE_NAME
              value: "api-gateway"
            - name: PORT
              value: "3000"
            - name: USER_SERVICE_URL
              value: "http://user-service:3000"
            - name: CONCERT_SERVICE_URL
              value: "http://concert-service:3000"
            - name: ORDER_SERVICE_URL
              value: "http://order-service:3000"
            - name: PAYMENT_SERVICE_URL
              value: "http://payment-service:3000"
            - name: TICKET_SERVICE_URL
              value: "http://ticket-service:3000"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service:3000"

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30000
