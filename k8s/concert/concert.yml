apiVersion: apps/v1
kind: Deployment
metadata:
  name: concert-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: concert-service
  template:
    metadata:
      labels:
        app: concert-service
    spec:
      containers:
        - name: concert-service
          image: ticket-box-backend-concert-service:latest
          imagePullPolicy: IfNotPresent
          args: ["npx", "tsx", "src/index.ts"]

          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: concert-service-env
          env:
            - name: SERVICE_NAME
              value: "concert-service"
            - name: PORT
              value: "3000"
            - name: REDIS_URL
              value: "redis://redis:6379"

---
apiVersion: v1
kind: Service
metadata:
  name: concert-service
spec:
  type: ClusterIP
  selector:
    app: concert-service
  ports:
    - port: 3000
      targetPort: 3000
