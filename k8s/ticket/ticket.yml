apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ticket-service
  template:
    metadata:
      labels:
        app: ticket-service
    spec:
      containers:
        - name: ticket-service
          image: ticket-box-backend-ticket-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          args: ["npx", "tsx", "src/index.ts"]
          envFrom:
            - secretRef:
                name: ticket-service-env
          env:
            - name: SERVICE_NAME
              value: "ticket-service"
            - name: PORT
              value: "3000"
            - name: REDIS_URL
              value: "redis://redis:6379"

---
apiVersion: v1
kind: Service
metadata:
  name: ticket-service
spec:
  type: ClusterIP
  selector:
    app: ticket-service
  ports:
    - port: 3000
      targetPort: 3000
